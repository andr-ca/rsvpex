<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're on the list — RSVPex</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/images/favicon/favicon.svg">
  <link rel="stylesheet" href="/css/main.css">
  <meta name="ga4-measurement-id" content="{{GA4_MEASUREMENT_ID}}">
  <script>
    (() => {
      const measurementId =
        document
          .querySelector('meta[name="ga4-measurement-id"]')
          ?.getAttribute('content')
          ?.trim() ?? ''
      if (!/^G-[A-Z0-9]+$/.test(measurementId)) return
      window.dataLayer = window.dataLayer || []
      window.gtag = function gtag() {
        window.dataLayer.push(arguments)
      }
      window.gtag('js', new Date())
      window.gtag('config', measurementId)
      const script = document.createElement('script')
      script.async = true
      script.src = `https://www.googletagmanager.com/gtag/js?id=${encodeURIComponent(measurementId)}`
      document.head.appendChild(script)
    })()
  </script>
</head>
<body>

  <header>
    <nav class="site-nav" aria-label="Site navigation">
      <a href="/" class="nav-wordmark" aria-label="RSVPex home">RSVP<span>EX</span></a>
      <span class="nav-pill">Coming Soon</span>
    </nav>
  </header>

  <main>

        Thanks for joining! We'll be in touch when RSVPex launches.
      </p>

    </div>

      &nbsp;·&nbsp;

    </p>
  </footer>

</body>
</html>
