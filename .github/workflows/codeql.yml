name: CodeQL

# D-5 in recommendations.md: no static-analysis security scanning existed.
# This is CodeQL's "advanced setup" (a workflow file) rather than the
# repo-settings "default setup" toggle, since the latter requires a GitHub
# UI/API action outside what a code change can express — functionally
# equivalent coverage.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1' # weekly, Monday 07:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']
    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
